name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution FluxTick.slnx -c Release

      - name: Publish single-file, self-contained build
        run: dotnet publish src/FluxTick.App -c Release -r ${{ matrix.rid }} -p:OfficialBuild=true -o publish/${{ matrix.rid }}

      - name: Package
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          zip -j ../../FluxTick-${{ github.ref_name }}-${{ matrix.rid }}.zip FluxTick

      # The disk image holds an ad-hoc signed FluxTick.app. The in-app updater downloads FluxTick-{tag}-{rid}.dmg on macOS.
      - name: Build macOS app bundle and disk image
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: bash installer/macos/build-app.sh publish/osx-arm64 "${{ github.ref_name }}" "FluxTick-${{ github.ref_name }}-osx-arm64.dmg"

      # The portable zip has a distinct "-portable" name so that it never matches the updater's archive or setup patterns.
      - name: Package portable build
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish\win-x64\FluxTick.exe -DestinationPath "FluxTick-${{ github.ref_name }}-win-x64-portable.zip"

      # The runner image only has Inno Setup 6, which lacks the official Simplified Chinese translation that 7 ships.
      - name: Install Inno Setup 7
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 --exact --scope machine --location C:\InnoSetup7 `
            --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
          if (-not (Test-Path 'C:\InnoSetup7\ISCC.exe')) { throw 'Inno Setup 7 was not installed' }

      # The in-app updater installs FluxTick-{tag}-{rid}-setup.exe.
      - name: Build installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $numeric = ($version -split '-')[0] + '.0'
          & 'C:\InnoSetup7\ISCC.exe' /Qp "/DAppVersion=$version" "/DNumericVersion=$numeric" `
            "/DSourceExe=$PWD\publish\win-x64\FluxTick.exe" "/DOutputDir=$PWD" `
            "/DOutputName=FluxTick-$tag-win-x64-setup" installer\FluxTick.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: FluxTick-${{ github.ref_name }}-${{ matrix.rid }}*
          retention-days: 1
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum FluxTick-*.zip FluxTick-*.dmg FluxTick-*-setup.exe > SHA256SUMS.txt

      # A tag with a SemVer pre-release suffix (e.g. v1.2.0-beta.1, v1.2.0-rc.1) is published as a pre-release.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            FluxTick-*.zip
            FluxTick-*.dmg
            FluxTick-*-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Updates the Homebrew cask in coldhighsun/homebrew-tap. Pre-releases are skipped, like the in-app updater does.
  # HOMEBREW_TAP_TOKEN is a PAT with write access to contents of the tap repository.
  homebrew:
    name: Homebrew cask
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package-osx-arm64

      - uses: actions/checkout@v7
        with:
          repository: coldhighsun/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write cask
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum "FluxTick-${GITHUB_REF_NAME}-osx-arm64.dmg" | cut -d' ' -f1)
          mkdir -p tap/Casks
          cat > tap/Casks/fluxtick.rb <<EOF
          cask "fluxtick" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/coldhighsun/FluxTick/releases/download/v#{version}/FluxTick-v#{version}-osx-arm64.dmg"
            name "FluxTick"
            desc "Floating widget for tracking multiple financial markets"
            homepage "https://github.com/coldhighsun/FluxTick"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on arch: :arm64
            depends_on macos: ">= :monterey"

            app "FluxTick.app"

            # The app is only signed ad hoc, so drop the quarantine flag that would make Gatekeeper block it.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/FluxTick.app"]
            end

            zap trash: "~/.config/FluxTick"
          end
          EOF

      - name: Commit and push
        shell: bash
        working-directory: tap
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Cask is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/fluxtick.rb
          git commit -m "fluxtick ${GITHUB_REF_NAME#v}"
          git push
