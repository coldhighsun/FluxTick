name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution FluxTick.slnx -c Release

      - name: Publish single-file, self-contained build
        run: dotnet publish src/FluxTick.App -c Release -r ${{ matrix.rid }} -p:OfficialBuild=true -o publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            7z a ../../FluxTick-${{ github.ref_name }}-${{ matrix.rid }}.zip FluxTick.exe
          else
            zip -j ../../FluxTick-${{ github.ref_name }}-${{ matrix.rid }}.zip FluxTick
          fi

      # The installer gets its own name (-setup.exe) so the in-app updater, which matches FluxTick-{tag}-{rid}.zip, ignores it.
      - name: Build installer
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $numeric = ($version -split '-')[0] + '.0'
          iscc /Qp "/DAppVersion=$version" "/DNumericVersion=$numeric" `
            "/DSourceExe=$PWD\publish\win-x64\FluxTick.exe" "/DOutputDir=$PWD" `
            "/DOutputName=FluxTick-$tag-win-x64-setup" installer\FluxTick.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: FluxTick-${{ github.ref_name }}-${{ matrix.rid }}*
          retention-days: 1
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum FluxTick-*.zip FluxTick-*-setup.exe > SHA256SUMS.txt

      # A tag with a SemVer pre-release suffix (e.g. v1.2.0-beta.1, v1.2.0-rc.1) is published as a pre-release.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            FluxTick-*.zip
            FluxTick-*-setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
